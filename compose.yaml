name: mindora

services:
  mysql:
    image: mysql:8.4
    container_name: mindora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mindora}
      MYSQL_USER: ${MYSQL_USER:-mindora}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mindora_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mindora_root_password}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - ${MINDORA_DOCKER_DATA_ROOT:-/data/docker-data/mindora}/mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: mindora-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ${MINDORA_DOCKER_DATA_ROOT:-/data/docker-data/mindora}/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: mindora-qdrant
    restart: unless-stopped
    ports:
      - '${QDRANT_HTTP_PORT:-6333}:6333'
      - '${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - ${MINDORA_DOCKER_DATA_ROOT:-/data/docker-data/mindora}/qdrant:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:6333/healthz | grep -q healthz']
      interval: 10s
      timeout: 5s
      retries: 10

  rmqnamesrv:
    image: apache/rocketmq:5.3.2
    container_name: mindora-rmqnamesrv
    restart: unless-stopped
    command: ['sh', 'mqnamesrv']
    ports:
      - '${ROCKETMQ_NAMESRV_PORT:-9876}:9876'
    volumes:
      - ${MINDORA_DOCKER_DATA_ROOT:-/data/docker-data/mindora}/rocketmq/namesrv/logs:/home/rocketmq/logs
    healthcheck:
      test: ['CMD-SHELL', 'sh mqadmin clusterList -n 127.0.0.1:9876 >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  rmqbroker:
    image: apache/rocketmq:5.3.2
    container_name: mindora-rmqbroker
    restart: unless-stopped
    depends_on:
      rmqnamesrv:
        condition: service_started
    ports:
      - '${ROCKETMQ_BROKER_LISTEN_PORT:-10911}:10911'
      - '${ROCKETMQ_BROKER_FAST_PORT:-10909}:10909'
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
      ROCKETMQ_BROKER_IP: ${ROCKETMQ_BROKER_IP:-192.168.222.128}
    command: >
      sh -c "printf '%s\n'
      'brokerClusterName=DefaultCluster'
      'brokerName=broker-a'
      'brokerId=0'
      'deleteWhen=04'
      'fileReservedTime=48'
      'brokerRole=ASYNC_MASTER'
      'flushDiskType=ASYNC_FLUSH'
      'listenPort=10911'
      'brokerIP1=${ROCKETMQ_BROKER_IP:-192.168.222.128}'
      > /tmp/mindora-broker.conf
      && sh mqbroker -n rmqnamesrv:9876 -c /tmp/mindora-broker.conf"
    volumes:
      - ${MINDORA_DOCKER_DATA_ROOT:-/data/docker-data/mindora}/rocketmq/broker/logs:/home/rocketmq/logs
      - ${MINDORA_DOCKER_DATA_ROOT:-/data/docker-data/mindora}/rocketmq/broker/store:/home/rocketmq/store
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'sh mqadmin brokerStatus -n rmqnamesrv:9876 -b 127.0.0.1:10911 >/dev/null 2>&1'
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
