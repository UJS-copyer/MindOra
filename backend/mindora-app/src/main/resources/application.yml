server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: mindora-app
  config:
    import:
      - optional:file:./config/mindora-local.yml
      - optional:file:mindora-app/config/mindora-local.yml
      - optional:file:backend/mindora-app/config/mindora-local.yml
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: ${TZ:Asia/Shanghai}
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.222.128}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mindora}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:mindora}
    password: ${MYSQL_PASSWORD:mindora_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:192.168.222.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:192.168.222.128:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:mindora-stage0-producer}

mindora:
  seed:
    enabled: ${MINDORA_SEED_ENABLED:false}
  persistence:
    blog: ${MINDORA_BLOG_PERSISTENCE:jdbc}
    user: ${MINDORA_USER_PERSISTENCE:jdbc}
    asset: ${MINDORA_ASSET_PERSISTENCE:jdbc}
    knowledge: ${MINDORA_KNOWLEDGE_PERSISTENCE:jdbc}
  knowledge:
    async: ${MINDORA_KNOWLEDGE_ASYNC:true}
    dispatcher: ${MINDORA_KNOWLEDGE_DISPATCHER:rocketmq}
    sync-topic: ${MINDORA_KNOWLEDGE_SYNC_TOPIC:mindora-knowledge-sync}
    sync-consumer-group: ${MINDORA_KNOWLEDGE_SYNC_CONSUMER_GROUP:mindora-knowledge-sync-consumer}
    gitee:
      enabled: ${MINDORA_GITEE_ENABLED:true}
      base-url: ${GITEE_API_BASE_URL:https://gitee.com/api/v5}
      default-token: ${GITEE_TOKEN:}
    embedding:
      enabled: ${MINDORA_EMBEDDING_ENABLED:true}
      provider: ${EMBEDDING_PROVIDER:bailian}
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
    rerank:
      enabled: ${MINDORA_RERANK_ENABLED:true}
      provider: ${RERANK_PROVIDER:siliconflow}
      base-url: ${RERANK_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${RERANK_MODEL_API_KEY:}
      model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    vector:
      enabled: ${MINDORA_VECTOR_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-stage0-secret}
  cors:
    allowed-origins: ${MINDORA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  storage:
    root: ${MINDORA_STORAGE_ROOT:/data/docker-data/mindora/storage}
  qdrant:
    url: ${QDRANT_URL:http://192.168.222.128:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:mindora_chunks}
    vector-name: ${QDRANT_VECTOR_NAME:dense}
  infrastructure:
    vm-host: ${MINDORA_VM_HOST:192.168.222.128}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.mindora: ${LOG_LEVEL_MINDORA:DEBUG}
    org.springframework.security: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'
