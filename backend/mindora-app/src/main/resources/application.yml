server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: mindora-app
  config:
    import:
      - optional:file:./config/mindora-local.yml
      - optional:file:mindora-app/config/mindora-local.yml
      - optional:file:backend/mindora-app/config/mindora-local.yml
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: ${TZ:Asia/Shanghai}
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.222.128}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mindora}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:mindora}
    password: ${MYSQL_PASSWORD:mindora_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:192.168.222.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:192.168.222.128:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:mindora-stage0-producer}

mindora:
  seed:
    enabled: ${MINDORA_SEED_ENABLED:false}
  persistence:
    blog: ${MINDORA_BLOG_PERSISTENCE:jdbc}
    user: ${MINDORA_USER_PERSISTENCE:jdbc}
    asset: ${MINDORA_ASSET_PERSISTENCE:jdbc}
    knowledge: ${MINDORA_KNOWLEDGE_PERSISTENCE:jdbc}
  knowledge:
    async: ${MINDORA_KNOWLEDGE_ASYNC:true}
    dispatcher: ${MINDORA_KNOWLEDGE_DISPATCHER:rocketmq}
    sync-topic: ${MINDORA_KNOWLEDGE_SYNC_TOPIC:mindora-knowledge-sync}
    sync-consumer-group: ${MINDORA_KNOWLEDGE_SYNC_CONSUMER_GROUP:mindora-knowledge-sync-consumer}
    gitee:
      enabled: ${MINDORA_GITEE_ENABLED:true}
      base-url: ${GITEE_API_BASE_URL:https://gitee.com/api/v5}
      default-token: ${GITEE_TOKEN:}
    embedding:
      enabled: ${MINDORA_EMBEDDING_ENABLED:true}
      provider: ${EMBEDDING_PROVIDER:bailian}
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      timeout-ms: ${MINDORA_EMBEDDING_TIMEOUT_MS:10000}
    rerank:
      enabled: ${MINDORA_RERANK_ENABLED:true}
      provider: ${RERANK_PROVIDER:siliconflow}
      base-url: ${RERANK_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${RERANK_MODEL_API_KEY:}
      model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
      timeout-ms: ${MINDORA_RERANK_TIMEOUT_MS:3000}
    vector:
      enabled: ${MINDORA_VECTOR_ENABLED:true}
    keyword:
      enabled: ${MINDORA_KEYWORD_ENABLED:true}
      index-path: ${MINDORA_KEYWORD_INDEX_PATH:${MINDORA_STORAGE_ROOT:/data/docker-data/mindora/storage}/lucene/keyword}
    retrieval:
      top-n: ${MINDORA_RETRIEVAL_TOP_N:30}
      keyword-top-n: ${MINDORA_RETRIEVAL_KEYWORD_TOP_N:30}
      fusion-top-m: ${MINDORA_RETRIEVAL_FUSION_TOP_M:20}
      rerank-top-k: ${MINDORA_RETRIEVAL_RERANK_TOP_K:8}
      rerank-enabled: ${MINDORA_RETRIEVAL_RERANK_ENABLED:true}
      keyword-enabled: ${MINDORA_RETRIEVAL_KEYWORD_ENABLED:true}
      rrf-k: ${MINDORA_RETRIEVAL_RRF_K:60}
      fallback-enabled: ${MINDORA_RETRIEVAL_FALLBACK_ENABLED:true}
  # 生成层（问答）：检索 → 上下文组装（含检索后扩展）→ 对话模型 → 服务端引用校验
  rag:
    chat:
      enabled: ${MINDORA_RAG_CHAT_ENABLED:true}
      provider: ${MINDORA_RAG_CHAT_PROVIDER:siliconflow}
      base-url: ${RAG_CHAT_BASE_URL:https://api.siliconflow.cn/v1}
      # 兜底顺序：显式 RAG_CHAT_API_KEY → 本地配置里的 knowledge.rerank.api-key。
      # 同一个 SiliconFlow 账号同时提供对话与重排，本地开发因此开箱可用；
      # 换供应商或换账号时必须显式配置，否则会静默走降级路径（启动时会打 WARN）。
      api-key: ${RAG_CHAT_API_KEY:${mindora.knowledge.rerank.api-key:}}
      # 默认模型按实机对比选定：7B 正例 8/15，30B-A3B 正例 15/15（详见 docs/design-11-rag-answer-generation-layer.md）
      model: ${RAG_CHAT_MODEL:Qwen/Qwen3-30B-A3B-Instruct-2507}
      timeout-ms: ${RAG_CHAT_TIMEOUT_MS:15000}
      temperature: ${RAG_CHAT_TEMPERATURE:0.2}
      max-tokens: ${RAG_CHAT_MAX_TOKENS:2048}
    context:
      budget-chars: ${RAG_CONTEXT_BUDGET:4000}
      expansion-enabled: ${RAG_CONTEXT_EXPANSION:true}
      expansion-added-chars: ${RAG_EXPANSION_ADDED:1500}
      section-cap: ${RAG_SECTION_CAP:4}
    validation:
      # 是否强制引用片段逐字可核（关闭后仅校验编号，引用文本回退为服务端摘录）
      require-verbatim-quote: ${RAG_REQUIRE_VERBATIM_QUOTE:true}
    # 公开问答（匿名可访问）：scope 由服务端硬编码为 public
    public:
      enabled: ${MINDORA_RAG_PUBLIC_ENABLED:true}
      rate-limit:
        # redis（生产默认）| memory（测试/无 Redis 单实例）
        backend: ${RAG_RATE_LIMIT_BACKEND:redis}
        window-seconds: 60
        # 匿名按来源 IP 计，登录用户按 userId 计（额度更宽）
        anonymous-per-minute: 6
        logged-in-per-minute: 20
      stream:
        # SSE 流式任务线程池：有界，队列 0，超出容量回 server_busy 事件
        executor-core: 2
        executor-max: 16
    security:
      secret-guard:
        # 密钥兜底：公开问答检索后扫上下文、生成后扫答案与引用摘录，命中即拒答（见 docs/design-11）
        enabled: ${RAG_SECRET_GUARD_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-stage0-secret}
  cors:
    allowed-origins: ${MINDORA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  storage:
    root: ${MINDORA_STORAGE_ROOT:/data/docker-data/mindora/storage}
  qdrant:
    url: ${QDRANT_URL:http://192.168.222.128:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:mindora_chunk}
    vector-name: ${QDRANT_VECTOR_NAME:dense}
  infrastructure:
    vm-host: ${MINDORA_VM_HOST:192.168.222.128}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.mindora: ${LOG_LEVEL_MINDORA:DEBUG}
    org.springframework.security: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'
