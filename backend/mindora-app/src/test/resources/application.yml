spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  flyway:
    enabled: false

mindora:
  persistence:
    blog: memory
    user: memory
    asset: filesystem
    knowledge: memory
  knowledge:
    async: false
    dispatcher: executor
    # 测试环境关闭关键词索引，避免在磁盘上创建 Lucene 索引目录；
    # 关键词适配器由自身单测（LuceneKeywordIndexAdapterTest）覆盖
    keyword:
      enabled: false
  rag:
    # 测试环境关闭对话模型：注入 Unavailable 适配器，问答走「只给检索片段」的降级路径，
    # 既不需要真实密钥，也不会让上下文加载失败（对话适配器由自身单测覆盖）
    chat:
      enabled: false
      # 会话历史用内存实现（测试不连 MySQL；JDBC 实现与 memory 同契约，靠实机验收兜底）
      history:
        backend: memory
      memory:
        context-turns: 4
        max-history-tokens: 3000
    public:
      rate-limit:
        # 测试不连 Redis；额度调高，避免功能用例互相计数（限流行为由 PublicRagRateLimitTest 单独覆盖）
        backend: memory
        anonymous-per-minute: 1000
        logged-in-per-minute: 1000
  seed:
    enabled: false
